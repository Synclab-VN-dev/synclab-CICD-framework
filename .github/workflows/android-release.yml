name: Synclab Android Release

on:
  workflow_call:
    inputs:
      configFile:
        required: false
        type: string
        default: synclab-release.json
      bump:
        required: false
        type: string
        default: d
      versionName:
        required: false
        type: string
        default: ""
      dryRun:
        required: false
        type: boolean
        default: true
      frameworkRef:
        required: false
        type: string
        default: v1.0.2
      signingMode:
        required: false
        type: string
        default: self-hosted
      signingUrl:
        required: false
        type: string
        default: https://sign.synclab.com.vn
    secrets:
      SYNCLAB_SIGNING_API_KEY_PREVIEW:
        required: false
      SYNCLAB_SIGNING_API_KEY_PROD:
        required: false

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate signing mode
        env:
          SIGNING_MODE: ${{ inputs.signingMode }}
        run: |
          case "$SIGNING_MODE" in
            self-hosted|public-api) ;;
            *)
              echo "Unsupported signingMode: $SIGNING_MODE" >&2
              exit 1
              ;;
          esac

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout framework action
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework

      - name: Prepare release plan
        uses: ./.synclab-cicd-framework
        env:
          SYNCLAB_CICD_SECRETS_JSON: ${{ toJson(secrets) }}
        with:
          command: prepare
          config-file: ${{ inputs.configFile }}
          bump: ${{ inputs.bump }}
          version-name: ${{ inputs.versionName }}
          dry-run: ${{ inputs.dryRun }}

      - name: Validate artifact signing mode
        env:
          SIGNING_MODE: ${{ inputs.signingMode }}
        run: |
          PYTHONPATH=.synclab-cicd-framework python - <<'PY'
          import os
          from pathlib import Path
          from synclab_release.staged_pipeline import validate_signing_mode_for_plan
          validate_signing_mode_for_plan(Path("synclab-release-plan/release-plan.json"), os.environ["SIGNING_MODE"])
          PY

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan/*
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ""

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Checkout framework action
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework

      - name: Build unsigned Android artifacts
        uses: ./.synclab-cicd-framework
        env:
          SYNCLAB_CICD_SECRETS_JSON: ${{ toJson(secrets) }}
        with:
          command: build
          plan-file: synclab-release-plan/release-plan.json
          output-dir: synclab-unsigned-apks

      - name: Capture unsigned artifact tree
        run: |
          set -eux
          find synclab-unsigned-apks -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-unsigned-apks/tree-from-workflow.txt

      - name: Upload unsigned Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          path: synclab-unsigned-apks/*
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-debug-logs
          path: |
            synclab-build.log
            synclab-release-artifacts/*.log
          if-no-files-found: ignore

  sign:
    needs: build
    runs-on: ${{ fromJSON(inputs.signingMode == 'public-api' && '"ubuntu-latest"' || '["self-hosted","linux","x64","synclab-signing"]') }}
    steps:
      - name: Checkout caller repository
        if: ${{ inputs.signingMode == 'public-api' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: ${{ inputs.signingMode == 'public-api' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release plan
        if: ${{ inputs.signingMode == 'public-api' }}
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Checkout framework action
        if: ${{ inputs.signingMode == 'public-api' }}
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework

      - name: Download unsigned Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apks
          path: synclab-unsigned-apks

      - name: Sign Android artifacts through public API
        if: ${{ inputs.signingMode == 'public-api' }}
        uses: ./.synclab-cicd-framework
        env:
          SYNCLAB_SIGNING_URL: ${{ inputs.signingUrl }}
          SYNCLAB_SIGNING_API_KEY_PREVIEW: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PREVIEW }}
          SYNCLAB_SIGNING_API_KEY_PROD: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PROD }}
        with:
          command: sign
          plan-file: synclab-release-plan/release-plan.json
          unsigned-dir: synclab-unsigned-apks
          output-dir: synclab-signed-apks

      - name: Sign APKs on NAS
        if: ${{ inputs.signingMode == 'self-hosted' }}
        env:
          SYNCLAB_SIGNING_API_KEY_PREVIEW: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PREVIEW }}
          SYNCLAB_SIGNING_API_KEY_PROD: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PROD }}
        run: |
          set -eux
          mkdir -p synclab-signed-apks

          curl -k -sS https://127.0.0.1:8443/health | tee synclab-signed-apks/signing-health.json

          cp synclab-unsigned-apks/debug.apk synclab-signed-apks/debug.apk

          sign_one() {
            target="$1"
            profile="$2"
            api_key="$3"
            if [ -z "$api_key" ]; then
              echo "[SIGN_FAILED] signing API key is required for profile: $profile" >&2
              exit 1
            fi

            apk_in="synclab-unsigned-apks/${target}.apk"
            apk_out="synclab-signed-apks/${target}-signed.apk"
            [ -f "$apk_in" ] || {
              echo "[SIGN_FAILED] unsigned APK not found: $apk_in" >&2
              find synclab-unsigned-apks -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-signed-apks/unsigned-tree.txt
              exit 1
            }

            curl -k -sS \
              -D "synclab-signed-apks/${target}-sign-headers.txt" \
              -w "\nHTTP_CODE=%{http_code}\n" \
              -H "X-Synclab-Api-Key: $api_key" \
              -F "profile=${profile}" \
              -F "metadata={\"repo\":\"${{ github.repository }}\",\"target\":\"${target}\",\"sha\":\"${{ github.sha }}\",\"run_id\":\"${{ github.run_id }}\",\"framework\":\"synclab-cicd\"}" \
              -F "apk=@${apk_in};type=application/vnd.android.package-archive" \
              https://127.0.0.1:8443/v1/sign/android/apk \
              -o "$apk_out" | tee "synclab-signed-apks/${target}-sign-http-code.txt"

            grep -q "HTTP_CODE=200" "synclab-signed-apks/${target}-sign-http-code.txt"
          }

          sign_one debug preview "$SYNCLAB_SIGNING_API_KEY_PREVIEW"
          sign_one prerelease preview "$SYNCLAB_SIGNING_API_KEY_PREVIEW"
          sign_one release prod "$SYNCLAB_SIGNING_API_KEY_PROD"
          find synclab-signed-apks -maxdepth 1 -type f -printf '%p %s bytes\n' | tee synclab-signed-apks/signed-tree.txt

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: synclab-signed-apks/*
          if-no-files-found: error

      - name: Upload sign logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-debug-logs
          path: |
            synclab-signed-apks/*.json
            synclab-signed-apks/*.txt
          if-no-files-found: ignore

  verify_publish:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout framework action
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Download signed Android artifacts
        uses: actions/download-artifact@v4
        with:
          name: signed-apks
          path: synclab-signed-apks

      - name: Setup bundletool for AAB verification
        shell: bash
        run: |
          set -euo pipefail
          if python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("synclab-release-plan/release-plan.json").read_text())
          raise SystemExit(0 if any(t.get("artifactType") == "aab" for t in plan.get("targets", [])) else 1)
          PY
          then
            BUNDLETOOL_VERSION=1.18.3
            BUNDLETOOL_SHA256=a099cfa1543f55593bc2ed16a70a7c67fe54b1747bb7301f37fdfd6d91028e29
            BUNDLETOOL_JAR="$RUNNER_TEMP/bundletool-all-$BUNDLETOOL_VERSION.jar"
            curl -fsSL \
              "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
              -o "$BUNDLETOOL_JAR"
            echo "$BUNDLETOOL_SHA256  $BUNDLETOOL_JAR" | sha256sum -c -
            echo "BUNDLETOOL_JAR=$BUNDLETOOL_JAR" >> "$GITHUB_ENV"
          fi

      - name: Verify and publish release
        uses: ./.synclab-cicd-framework
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: verify-publish
          dry-run: ${{ inputs.dryRun }}
          plan-file: synclab-release-plan/release-plan.json
          signed-dir: synclab-signed-apks
          output-dir: synclab-final-artifacts

      - name: Capture final artifact tree
        run: |
          set -eux
          find synclab-final-artifacts -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-final-artifacts/tree-from-workflow.txt

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-artifacts
          path: |
            synclab-final-artifacts/*
          if-no-files-found: ignore
