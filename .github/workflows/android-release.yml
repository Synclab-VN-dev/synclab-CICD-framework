name: Synclab Android Release

on:
  workflow_call:
    inputs:
      configFile:
        required: false
        type: string
        default: synclab-release.json
      bump:
        required: false
        type: string
        default: d
      versionName:
        required: false
        type: string
        default: ""
      dryRun:
        required: false
        type: boolean
        default: true
      frameworkRef:
        required: false
        type: string
        default: v1.0.1
    secrets:
      SYNCLAB_SIGNING_API_KEY_PREVIEW:
        required: true
      SYNCLAB_SIGNING_API_KEY_PROD:
        required: true
      RELEASE_GH_TOKEN:
        required: true

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout framework action
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - name: Prepare release plan
        uses: ./.synclab-cicd-framework
        env:
          SYNCLAB_CICD_SECRETS_JSON: ${{ toJson(secrets) }}
        with:
          command: prepare
          config-file: ${{ inputs.configFile }}
          bump: ${{ inputs.bump }}
          version-name: ${{ inputs.versionName }}
          dry-run: ${{ inputs.dryRun }}

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan/*
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Checkout framework action
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - name: Build unsigned APKs
        uses: ./.synclab-cicd-framework
        env:
          SYNCLAB_CICD_SECRETS_JSON: ${{ toJson(secrets) }}
        with:
          command: build
          plan-file: synclab-release-plan/release-plan.json
          output-dir: synclab-unsigned-apks

      - name: Capture unsigned artifact tree
        run: |
          set -eux
          find synclab-unsigned-apks -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-unsigned-apks/tree-from-workflow.txt

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          path: synclab-unsigned-apks/*
          if-no-files-found: error

      - name: Upload build logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-debug-logs
          path: |
            synclab-build.log
            synclab-release-artifacts/*.log
          if-no-files-found: ignore

  sign:
    needs: build
    runs-on: [self-hosted, linux, x64, synclab-signing]
    steps:
      - name: Download unsigned APKs
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apks
          path: synclab-unsigned-apks

      - name: Sign APKs on NAS
        env:
          SYNCLAB_SIGNING_API_KEY_PREVIEW: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PREVIEW }}
          SYNCLAB_SIGNING_API_KEY_PROD: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PROD }}
        run: |
          set -eux
          mkdir -p synclab-signed-apks

          curl -k -sS https://127.0.0.1:8443/health | tee synclab-signed-apks/signing-health.json

          cp synclab-unsigned-apks/debug.apk synclab-signed-apks/debug.apk

          sign_one() {
            target="$1"
            profile="$2"
            api_key="$3"
            if [ -z "$api_key" ]; then
              echo "[SIGN_FAILED] signing API key is required for profile: $profile" >&2
              exit 1
            fi

            apk_in="synclab-unsigned-apks/${target}.apk"
            apk_out="synclab-signed-apks/${target}-signed.apk"
            [ -f "$apk_in" ] || {
              echo "[SIGN_FAILED] unsigned APK not found: $apk_in" >&2
              find synclab-unsigned-apks -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-signed-apks/unsigned-tree.txt
              exit 1
            }

            curl -k -sS \
              -D "synclab-signed-apks/${target}-sign-headers.txt" \
              -w "\nHTTP_CODE=%{http_code}\n" \
              -H "X-Synclab-Api-Key: $api_key" \
              -F "profile=${profile}" \
              -F "metadata={\"repo\":\"${{ github.repository }}\",\"target\":\"${target}\",\"sha\":\"${{ github.sha }}\",\"run_id\":\"${{ github.run_id }}\",\"framework\":\"synclab-cicd\"}" \
              -F "apk=@${apk_in};type=application/vnd.android.package-archive" \
              https://127.0.0.1:8443/v1/sign/android/apk \
              -o "$apk_out" | tee "synclab-signed-apks/${target}-sign-http-code.txt"

            grep -q "HTTP_CODE=200" "synclab-signed-apks/${target}-sign-http-code.txt"
          }

          sign_one prerelease preview "$SYNCLAB_SIGNING_API_KEY_PREVIEW"
          sign_one release prod "$SYNCLAB_SIGNING_API_KEY_PROD"
          find synclab-signed-apks -maxdepth 1 -type f -printf '%p %s bytes\n' | tee synclab-signed-apks/signed-tree.txt

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: synclab-signed-apks/*
          if-no-files-found: error

      - name: Upload sign logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-debug-logs
          path: |
            synclab-signed-apks/*.json
            synclab-signed-apks/*.txt
          if-no-files-found: ignore

  verify_publish:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Checkout framework action
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework
          token: ${{ secrets.RELEASE_GH_TOKEN }}

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: signed-apks
          path: synclab-signed-apks

      - name: Verify and publish release
        uses: ./.synclab-cicd-framework
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        with:
          command: verify-publish
          dry-run: ${{ inputs.dryRun }}
          plan-file: synclab-release-plan/release-plan.json
          signed-dir: synclab-signed-apks
          output-dir: synclab-final-artifacts

      - name: Capture final artifact tree
        run: |
          set -eux
          find synclab-final-artifacts -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-final-artifacts/tree-from-workflow.txt

      - name: Upload final artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-artifacts
          path: |
            synclab-final-artifacts/*
          if-no-files-found: ignore
