name: Reusable Android graph probe

on:
  workflow_call:
    inputs:
      signingMode:
        required: false
        type: string
        default: self-hosted

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - run: echo prepare
  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - run: echo build
  sign:
    needs: build
    runs-on: ${{ fromJSON(inputs.signingMode == 'public-api' && '"ubuntu-latest"' || '["self-hosted","linux","x64","synclab-signing"]') }}
    steps:
      - run: echo sign
  verify_publish:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - run: echo verify
