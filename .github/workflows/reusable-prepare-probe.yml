name: Reusable prepare probe

on:
  workflow_call:
    inputs:
      configFile:
        required: false
        type: string
        default: synclab-release.json
      bump:
        required: false
        type: string
        default: d
      versionName:
        required: false
        type: string
        default: ""
      dryRun:
        required: false
        type: boolean
        default: true
      frameworkRef:
        required: false
        type: string
        default: issue-6-public-api-signing
    secrets:
      SYNCLAB_SIGNING_API_KEY_PREVIEW:
        required: false
      SYNCLAB_SIGNING_API_KEY_PROD:
        required: false

permissions:
  contents: write
  actions: read
  packages: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Checkout framework action
        uses: actions/checkout@v4
        with:
          repository: Synclab-VN-dev/synclab-CICD-framework
          ref: ${{ inputs.frameworkRef }}
          path: .synclab-cicd-framework
      - name: Prepare release plan
        uses: ./.synclab-cicd-framework
        env:
          SYNCLAB_CICD_SECRETS_JSON: ${{ toJson(secrets) }}
        with:
          command: prepare
          config-file: ${{ inputs.configFile }}
          bump: ${{ inputs.bump }}
          version-name: ${{ inputs.versionName }}
          dry-run: ${{ inputs.dryRun }}
