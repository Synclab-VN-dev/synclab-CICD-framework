name: One-off release v1.1.1

on:
  push:
    branches:
      - issue-6-public-api-signing
    paths:
      - .github/workflows/release-v1.1.1.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish v1.1.1 from merged AAB framework commit
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: f7c38f903d790b1586ec628916e4b700807a11a8
          TAG: v1.1.1
        run: |
          set -euo pipefail

          git fetch origin "$TARGET_SHA"

          remote_sha="$(git ls-remote --tags origin "refs/tags/$TAG" | awk '{print $1}')"
          if [ -n "$remote_sha" ]; then
            test "$remote_sha" = "$TARGET_SHA"
          else
            git tag "$TAG" "$TARGET_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi

          gh release create "$TAG"             --repo "$GITHUB_REPOSITORY"             --verify-tag             --title "$TAG"             --notes "Patch release based on framework main after PR #8. Includes Android App Bundle (AAB) artifact support across build, signing, verification and reusable release workflow, on top of the public API signing support introduced in v1.1.0."
