name: Synclab Android Release Self-host POC

on:
  workflow_call:
    inputs:
      configFile:
        required: false
        type: string
        default: synclab-release.json
      bump:
        required: false
        type: string
        default: d
      versionName:
        required: false
        type: string
        default: ""
      dryRun:
        required: false
        type: boolean
        default: true
    secrets:
      SYNCLAB_SIGNING_API_KEY_PREVIEW:
        required: true
      SYNCLAB_SIGNING_API_KEY_PROD:
        required: true
      RELEASE_GH_TOKEN:
        required: false

permissions:
  contents: write
  actions: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner debug
        run: |
          set -eux
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "GITHUB_REPOSITORY=$GITHUB_REPOSITORY"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare release plan
        uses: Synclab-VN-dev/synclab-release-framework@codex/selfhost-signing-poc
        with:
          command: prepare
          config-file: ${{ inputs.configFile }}
          bump: ${{ inputs.bump }}
          version-name: ${{ inputs.versionName }}
          dry-run: ${{ inputs.dryRun }}

      - name: Upload release plan
        uses: actions/upload-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan/*
          if-no-files-found: error

  build:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Build unsigned APKs
        uses: Synclab-VN-dev/synclab-release-framework@codex/selfhost-signing-poc
        with:
          command: build
          dry-run: "true"
          plan-file: synclab-release-plan/release-plan.json
          output-dir: synclab-unsigned-apks

      - name: Capture unsigned artifact tree
        run: |
          set -eux
          find synclab-unsigned-apks -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-unsigned-apks/tree-from-workflow.txt

      - name: Upload unsigned APKs
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-apks
          path: synclab-unsigned-apks/*
          if-no-files-found: error

      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-debug-logs
          path: |
            synclab-build-poc.log
            synclab-release-artifacts/*.log
          if-no-files-found: ignore

  sign:
    needs: build
    runs-on: [self-hosted, linux, x64, synclab-signing]
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Runner debug
        run: |
          set -eux
          echo "RUNNER_NAME=$RUNNER_NAME"
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          hostname
          uname -a
          curl -k -sS https://127.0.0.1:8443/health | tee signing-runner-health.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Download unsigned APKs
        uses: actions/download-artifact@v4
        with:
          name: unsigned-apks
          path: synclab-unsigned-apks

      - name: Sign APKs on NAS
        uses: Synclab-VN-dev/synclab-release-framework@codex/selfhost-signing-poc
        env:
          SYNCLAB_SIGNING_API_KEY_PREVIEW: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PREVIEW }}
          SYNCLAB_SIGNING_API_KEY_PROD: ${{ secrets.SYNCLAB_SIGNING_API_KEY_PROD }}
        with:
          command: sign
          dry-run: "true"
          plan-file: synclab-release-plan/release-plan.json
          unsigned-dir: synclab-unsigned-apks
          output-dir: synclab-signed-apks

      - name: Capture signed artifact tree
        run: |
          set -eux
          find synclab-signed-apks -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-signed-apks/tree-from-workflow.txt

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: signed-apks
          path: synclab-signed-apks/*
          if-no-files-found: error

      - name: Upload sign logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sign-debug-logs
          path: |
            signing-runner-health.json
            synclab-signed-apks/*.json
            synclab-signed-apks/*.txt
          if-no-files-found: ignore

  verify_publish:
    needs: sign
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download release plan
        uses: actions/download-artifact@v4
        with:
          name: release-plan
          path: synclab-release-plan

      - name: Download signed APKs
        uses: actions/download-artifact@v4
        with:
          name: signed-apks
          path: synclab-signed-apks

      - name: Verify and publish fake release
        uses: Synclab-VN-dev/synclab-release-framework@codex/selfhost-signing-poc
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_GH_TOKEN: ${{ secrets.RELEASE_GH_TOKEN }}
        with:
          command: verify-publish
          dry-run: ${{ inputs.dryRun }}
          plan-file: synclab-release-plan/release-plan.json
          signed-dir: synclab-signed-apks
          output-dir: synclab-final-artifacts

      - name: Capture final artifact tree
        run: |
          set -eux
          find synclab-final-artifacts -maxdepth 2 -type f -printf '%p %s bytes\n' | tee synclab-final-artifacts/tree-from-workflow.txt

      - name: Upload final logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: final-debug-logs
          path: |
            synclab-final-artifacts/*
          if-no-files-found: ignore
