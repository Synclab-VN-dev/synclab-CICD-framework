[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synclab-cicd-framework"
version = "0.1.0"
description = "Synclab internal Android CI/CD framework"
requires-python = ">=3.11"
readme = "README.md"

[project.scripts]
synclab-release = "synclab_release.main:main"

[tool.setuptools.packages.find]
include = ["synclab_release*"]
