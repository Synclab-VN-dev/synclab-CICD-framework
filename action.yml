name: Synclab Android Release
description: Internal Synclab Android release framework

inputs:
  command:
    description: "Command to run: preflight, run, prepare, build, sign, or verify-publish"
    required: true
    default: preflight
  config-file:
    description: Release config path in caller repository
    required: true
    default: synclab-release.json
  bump:
    description: Auto bump level
    required: false
    default: d
  version-name:
    description: Manual versionName override, format a.b.c.d
    required: false
    default: ""
  dry-run:
    description: Run without publishing
    required: false
    default: "true"
  plan-file:
    description: Release plan path for staged commands
    required: false
    default: ""
  unsigned-dir:
    description: Unsigned APK artifact directory for sign command
    required: false
    default: ""
  signed-dir:
    description: Signed APK artifact directory for verify-publish command
    required: false
    default: ""
  output-dir:
    description: Output directory for staged commands
    required: false
    default: ""
  targets:
    description: Optional comma-separated target names for sign command
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install Synclab release framework
      shell: bash
      run: |
        PYTHON_BIN="$(command -v python3 || command -v python)"
        "$PYTHON_BIN" -m pip install "$GITHUB_ACTION_PATH"

    - name: Run Synclab release command
      shell: bash
      run: |
        args=(
          "${{ inputs.command }}"
        )
        case "${{ inputs.command }}" in
          preflight|run|prepare)
            args+=("--config-file" "${{ inputs.config-file }}")
            args+=("--bump" "${{ inputs.bump }}")
            ;;
        esac
        if [[ -n "${{ inputs.version-name }}" && ( "${{ inputs.command }}" == "preflight" || "${{ inputs.command }}" == "run" || "${{ inputs.command }}" == "prepare" ) ]]; then
          args+=("--version-name" "${{ inputs.version-name }}")
        fi
        if [[ "${{ inputs.dry-run }}" == "true" && ( "${{ inputs.command }}" == "preflight" || "${{ inputs.command }}" == "run" || "${{ inputs.command }}" == "prepare" || "${{ inputs.command }}" == "verify-publish" ) ]]; then
          args+=("--dry-run")
        fi
        if [[ -n "${{ inputs.plan-file }}" ]]; then
          args+=("--plan-file" "${{ inputs.plan-file }}")
        fi
        if [[ -n "${{ inputs.unsigned-dir }}" ]]; then
          args+=("--unsigned-dir" "${{ inputs.unsigned-dir }}")
        fi
        if [[ -n "${{ inputs.signed-dir }}" ]]; then
          args+=("--signed-dir" "${{ inputs.signed-dir }}")
        fi
        if [[ -n "${{ inputs.output-dir }}" ]]; then
          args+=("--output-dir" "${{ inputs.output-dir }}")
        fi
        if [[ -n "${{ inputs.targets }}" ]]; then
          args+=("--targets" "${{ inputs.targets }}")
        fi
        synclab-release "${args[@]}"
